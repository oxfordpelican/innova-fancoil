substitutions:
  device_name: "innova-fancoil"

esphome:
  name: ${device_name}
  friendly_name: "Innova Fancoil"

  on_boot:
    # Priority 600: power rails up before RS485 is used.
    - priority: 600
      then:
        - output.turn_on: boost_5v_en_pin
        - output.turn_on: rs485_se_pin
        - output.turn_on: rs485_en_pin
    # After all entities restored their values: hand the UART and settings to the discovery engine.
    - priority: -100
      then:
        - lambda: |-
            disc.uart = id(uart_rs485);
            // A scan that finds a slave copies its address and serial settings into the HA entities.
            disc.on_found = [](mbdisc::Serial serial, uint8_t addr) {
              auto b = id(sel_baud).make_call();
              b.set_option(to_string(serial.baud));
              b.perform();
              auto f = id(sel_frame).make_call();
              f.set_index(serial.format);
              f.perform();
              auto m = id(sel_mode).make_call();
              m.set_index(serial.ascii ? 1 : 0);
              m.perform();
              auto a = id(num_slave).make_call();
              a.set_value(addr);
              a.perform();
            };
        - script.execute: sync_settings
        # Read-only fancoil sensors: polled every 30 s, one register per request (see README "Registers").
        - lambda: |-
            auto temp = [](sensor::Sensor *s) {
              return [s](bool ok, uint16_t raw) { s->publish_state(ok ? (int16_t) raw / 10.0f : NAN); };
            };
            disc.add_poll(0, temp(id(room_temperature)));
            disc.add_poll(8, temp(id(setpoint)));
            disc.add_poll(1, temp(id(water_temperature)));
            disc.add_poll(218, temp(id(min_water_heating)));
            disc.add_poll(219, temp(id(max_water_cooling)));
            disc.add_poll(201, [](bool ok, uint16_t raw) {
              static const char *const modes[] = {"auto", "min", "night", "max"};
              id(fan_mode).publish_state(ok ? modes[raw & 0x03] : "unknown");
              if (ok) id(power).publish_state((raw & 0x80) == 0);
            });
            disc.add_poll(233, [](bool ok, uint16_t raw) {
              id(operating_mode).publish_state(!ok ? "unknown" : raw == 3 ? "heating" : raw == 5 ? "cooling"
                                               : "unknown (" + to_string(raw) + ")");
            });
            disc.add_poll(104, [](bool ok, uint16_t raw) {
              id(status_104).publish_state(ok ? raw : NAN);
              if (ok) id(heating_demand).publish_state(raw & 0x0002);
              if (ok) id(water_too_cold).publish_state(raw & 0x0010);
            });
            auto raw = [](sensor::Sensor *s) {
              return [s](bool ok, uint16_t raw) { s->publish_state(ok ? raw : NAN); };
            };
            disc.add_poll(15, raw(id(fan_speed)));
            disc.add_poll(17, raw(id(fan_speed_17)));
            disc.add_poll(3, raw(id(status_3)));
            disc.add_poll(9, raw(id(status_9)));
        # Write allowlist: only mapped registers, in ranges that are safe to set back. Writes also
        # need the "Writes Enabled" switch, which is off after every boot.
        - lambda: |-
            disc.write_allowed = [](uint16_t reg, uint16_t value) {
              switch (reg) {
                case 8:
                case 231:
                  return value >= 160 && value <= 280;  // setpoint 16.0-28.0 degC
                case 201:
                  return value <= 3 || value == 128;  // fan mode auto/min/night/max, or off
                case 218:
                  return value >= 200 && value <= 350;  // probable heating minimum water temp, 20.0-35.0 degC (default 30.0)
                case 219:
                  return value >= 120 && value <= 250;  // probable cooling maximum water temp, 12.0-25.0 degC (default 20.0)
                case 210:
                  return value >= 400 && value <= 550;  // lowest fan speed in the rpm table (test, default 400)
                case 211:
                  return value >= 400 && value <= 550;  // second fan speed (test, default 550)
                case 212:
                  return value >= 400 && value <= 680;  // third fan speed, the cap in fan mode min (test, default 680)
                case 213:
                  return value >= 400 && value <= 1100;  // fourth fan speed, the cap seen in auto (test, default 1100)
                case 214:
                  return value >= 400 && value <= 1500;  // fifth fan speed (test, default 1500)
                case 215:
                  return value >= 400 && value <= 1700;  // highest fan speed (test, default 1700)
                default:
                  return false;
              }
            };
  includes:
    - modbus_discovery.h

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # Never reboot when HA is unreachable.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot when Wi-Fi is unreachable; password-protected, the web UI is open on it.
  ap:
    password: !secret ap_password

# LilyGo T-CAN485 power and RS485 transceiver pins.
output:
  - platform: gpio
    id: boost_5v_en_pin
    pin: GPIO16
  - platform: gpio
    id: rs485_se_pin
    pin: GPIO19
  - platform: gpio
    id: rs485_en_pin
    pin: GPIO17

uart:
  id: uart_rs485
  tx_pin: GPIO22
  rx_pin: GPIO21
  # Start value only: the discovery engine sets the serial format at runtime ("Modbus Baud/Frame/Mode").
  baud_rate: 9600
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 512

# Discovery settings and actions. The engine is modbus_discovery.h (RTU and ASCII, read-only: functions 01-04).
# Every setting change runs sync_settings, which copies all of them into the engine.
select:
  - platform: template
    id: sel_baud
    name: "Modbus Baud"
    icon: mdi:speedometer
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["2400", "4800", "9600", "19200", "38400", "57600", "115200"]
    initial_option: "9600"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_frame
    name: "Modbus Frame"
    icon: mdi:format-list-checks
    entity_category: config
    optimistic: true
    restore_value: true
    # Same order as FORMATS in modbus_discovery.h.
    options: ["8N1", "8E1", "8O1", "7E1", "7O1", "7N2", "8N2"]
    initial_option: "8N1"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_mode
    name: "Modbus Mode"
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["RTU", "ASCII"]
    initial_option: "RTU"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_functions
    name: "Dump Functions"
    icon: mdi:function
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["03 + 04", "03 Holding registers", "04 Input registers", "01 + 02", "01 Coils",
              "02 Discrete inputs", "All (01-04)"]
    initial_option: "03 + 04"
    on_value:
      - script.execute: sync_settings

number:
  - platform: template
    id: num_slave
    name: "Modbus Slave Address"
    icon: mdi:identifier
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 1
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_start
    name: "Register Start"
    icon: mdi:numeric
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 0
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_count
    name: "Register Count"
    icon: mdi:counter
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 2000
    step: 1
    initial_value: 100
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_scan_last
    name: "Scan Last Address"
    icon: mdi:magnify-expand
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 247
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_timeout
    name: "Reply Timeout"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: ms
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_write_reg
    name: "Write Register"
    icon: mdi:pencil
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 8
    mode: box
  - platform: template
    id: num_write_value
    name: "Write Value"
    icon: mdi:pencil
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 180
    mode: box

button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Scan Addresses"
    icon: mdi:magnify
    on_press:
      - lambda: disc.start_scan(false);
  - platform: template
    name: "Scan All Serial Settings"
    icon: mdi:magnify-scan
    on_press:
      - lambda: disc.start_scan(true);
  - platform: template
    name: "Dump Registers"
    icon: mdi:table-arrow-down
    on_press:
      - lambda: disc.start_dump(false);
  - platform: template
    name: "Write Register Value"
    icon: mdi:content-save-edit
    entity_category: config
    on_press:
      - lambda: disc.start_write((uint16_t) id(num_write_reg).state, (uint16_t) id(num_write_value).state);
  - platform: template
    name: "Stop Discovery"
    icon: mdi:stop
    on_press:
      - lambda: disc.stop();

switch:
  - platform: template
    name: "Writes Enabled"
    icon: mdi:pencil-lock
    entity_category: config
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: disc.writes_enabled = true;
    turn_off_action:
      - lambda: disc.writes_enabled = false;
  - platform: template
    name: "Watch Registers"
    icon: mdi:eye
    lambda: return disc.watching();
    turn_on_action:
      - lambda: disc.start_dump(true);
    turn_off_action:
      - lambda: disc.stop();

text_sensor:
  - platform: template
    id: fan_mode
    name: "Fan Mode"
    icon: mdi:fan
  - platform: template
    id: operating_mode
    name: "Operating Mode"
    icon: mdi:sun-snowflake-variant
  - platform: template
    name: "Discovery Status"
    icon: mdi:information-outline
    update_interval: 2s
    lambda: return disc.status;

script:
  - id: sync_settings
    mode: queued
    then:
      - lambda: |-
          static const uint32_t bauds[] = {2400, 4800, 9600, 19200, 38400, 57600, 115200};
          static const std::vector<uint8_t> functions[] = {{3, 4}, {3}, {4}, {1, 2}, {1}, {2}, {1, 2, 3, 4}};
          disc.set_serial({bauds[id(sel_baud).active_index().value_or(2)],
                           id(sel_frame).active_index().value_or(0),
                           id(sel_mode).active_index().value_or(0) == 1});
          disc.functions = functions[id(sel_functions).active_index().value_or(0)];
          disc.slave = (uint8_t) id(num_slave).state;
          disc.start = (uint16_t) id(num_start).state;
          disc.count = (uint16_t) id(num_count).state;
          disc.scan_last = (uint8_t) id(num_scan_last).state;
          disc.timeout_ms = (uint32_t) id(num_timeout).state;

interval:
  - interval: 10ms
    then:
      - lambda: disc.tick();

binary_sensor:
  - platform: template
    id: power
    name: "Power"
    device_class: power
  # Reg 104 bits: 1 = heating demand (fan running), 4 = water below the heating minimum (reg 218).
  - platform: template
    id: heating_demand
    name: "Heating Demand"
    device_class: heat
  - platform: template
    id: water_too_cold
    name: "Water Too Cold"
    icon: mdi:water-thermometer-outline

# Fancoil values, published by the polls registered in on_boot.
sensor:
  - platform: template
    id: room_temperature
    name: "Room Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: setpoint
    name: "Setpoint"
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: water_temperature
    name: "Water Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
  # Probable fan cut-off thresholds (parameters; 30.0 / 20.0 match the usual factory defaults).
  - platform: template
    id: min_water_heating
    name: "Min Water Temp Heating"
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: max_water_cooling
    name: "Max Water Temp Cooling"
    unit_of_measurement: "°C"
    device_class: temperature
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: never
  - platform: template
    id: status_104
    name: "Status Register 104"
    icon: mdi:list-status
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  # Fan speed: 0 = off, modulates from 400 (= parameter 210, the lowest of the rpm table 210-215) upwards.
  - platform: template
    id: fan_speed
    name: "Fan Speed"
    icon: mdi:fan
    unit_of_measurement: "rpm"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  # Always reg 15 / 5; reg 9 is 0 when the fan is off, reg 3 changes while it runs (meaning unknown).
  - platform: template
    id: fan_speed_17
    name: "Fan Speed Register 17"
    icon: mdi:fan
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: status_3
    name: "Status Register 3"
    icon: mdi:list-status
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: status_9
    name: "Status Register 9"
    icon: mdi:list-status
    entity_category: diagnostic
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    name: "WiFi Signal"
  - platform: uptime
    name: "Uptime"
