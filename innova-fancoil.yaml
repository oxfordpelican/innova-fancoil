substitutions:
  device_name: "innova-fancoil"

esphome:
  name: ${device_name}
  friendly_name: "Innova Fancoil"

  on_boot:
    # Priority 600: power rails up before RS485 is used.
    - priority: 600
      then:
        - output.turn_on: boost_5v_en_pin
        - output.turn_on: rs485_se_pin
        - output.turn_on: rs485_en_pin
    # After all entities restored their values: hand the UART and settings to the discovery engine.
    - priority: -100
      then:
        - lambda: |-
            disc.uart = id(uart_rs485);
            // A scan that finds a slave copies its address and serial settings into the HA entities.
            disc.on_found = [](mbdisc::Serial serial, uint8_t addr) {
              auto b = id(sel_baud).make_call();
              b.set_option(to_string(serial.baud));
              b.perform();
              auto f = id(sel_frame).make_call();
              f.set_index(serial.format);
              f.perform();
              auto m = id(sel_mode).make_call();
              m.set_index(serial.ascii ? 1 : 0);
              m.perform();
              auto a = id(num_slave).make_call();
              a.set_value(addr);
              a.perform();
            };
        - script.execute: sync_settings
  includes:
    - modbus_discovery.h

esp32:
  board: esp32dev
  framework:
    type: arduino

web_server:
  port: 80

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  # Never reboot when HA is unreachable.
  reboot_timeout: 0s

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot when Wi-Fi is unreachable; password-protected, the web UI is open on it.
  ap:
    password: !secret ap_password

# LilyGo T-CAN485 power and RS485 transceiver pins.
output:
  - platform: gpio
    id: boost_5v_en_pin
    pin: GPIO16
  - platform: gpio
    id: rs485_se_pin
    pin: GPIO19
  - platform: gpio
    id: rs485_en_pin
    pin: GPIO17

uart:
  id: uart_rs485
  tx_pin: GPIO22
  rx_pin: GPIO21
  # Start value only: the discovery engine sets the serial format at runtime ("Modbus Baud/Frame/Mode").
  baud_rate: 9600
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 512

# Discovery settings and actions. The engine is modbus_discovery.h (RTU and ASCII, read-only: functions 01-04).
# Every setting change runs sync_settings, which copies all of them into the engine.
select:
  - platform: template
    id: sel_baud
    name: "Modbus Baud"
    icon: mdi:speedometer
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["2400", "4800", "9600", "19200", "38400", "57600", "115200"]
    initial_option: "9600"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_frame
    name: "Modbus Frame"
    icon: mdi:format-list-checks
    entity_category: config
    optimistic: true
    restore_value: true
    # Same order as FORMATS in modbus_discovery.h.
    options: ["8N1", "8E1", "8O1", "7E1", "7O1", "7N2", "8N2"]
    initial_option: "8N1"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_mode
    name: "Modbus Mode"
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["RTU", "ASCII"]
    initial_option: "RTU"
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: sel_functions
    name: "Dump Functions"
    icon: mdi:function
    entity_category: config
    optimistic: true
    restore_value: true
    options: ["03 + 04", "03 Holding registers", "04 Input registers", "01 + 02", "01 Coils",
              "02 Discrete inputs", "All (01-04)"]
    initial_option: "03 + 04"
    on_value:
      - script.execute: sync_settings

number:
  - platform: template
    id: num_slave
    name: "Modbus Slave Address"
    icon: mdi:identifier
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 1
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_start
    name: "Register Start"
    icon: mdi:numeric
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 65535
    step: 1
    initial_value: 0
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_count
    name: "Register Count"
    icon: mdi:counter
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 2000
    step: 1
    initial_value: 100
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_scan_last
    name: "Scan Last Address"
    icon: mdi:magnify-expand
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 247
    step: 1
    initial_value: 247
    mode: box
    on_value:
      - script.execute: sync_settings
  - platform: template
    id: num_timeout
    name: "Reply Timeout"
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: ms
    optimistic: true
    restore_value: true
    min_value: 20
    max_value: 1000
    step: 10
    initial_value: 150
    mode: box
    on_value:
      - script.execute: sync_settings

button:
  - platform: restart
    name: "Restart"
  - platform: template
    name: "Scan Addresses"
    icon: mdi:magnify
    on_press:
      - lambda: disc.start_scan(false);
  - platform: template
    name: "Scan All Serial Settings"
    icon: mdi:magnify-scan
    on_press:
      - lambda: disc.start_scan(true);
  - platform: template
    name: "Dump Registers"
    icon: mdi:table-arrow-down
    on_press:
      - lambda: disc.start_dump(false);
  - platform: template
    name: "Stop Discovery"
    icon: mdi:stop
    on_press:
      - lambda: disc.stop();

switch:
  - platform: template
    name: "Watch Registers"
    icon: mdi:eye
    lambda: return disc.watching();
    turn_on_action:
      - lambda: disc.start_dump(true);
    turn_off_action:
      - lambda: disc.stop();

text_sensor:
  - platform: template
    name: "Discovery Status"
    icon: mdi:information-outline
    update_interval: 2s
    lambda: return disc.status;

script:
  - id: sync_settings
    mode: queued
    then:
      - lambda: |-
          static const uint32_t bauds[] = {2400, 4800, 9600, 19200, 38400, 57600, 115200};
          static const std::vector<uint8_t> functions[] = {{3, 4}, {3}, {4}, {1, 2}, {1}, {2}, {1, 2, 3, 4}};
          disc.set_serial({bauds[id(sel_baud).active_index().value_or(2)],
                           id(sel_frame).active_index().value_or(0),
                           id(sel_mode).active_index().value_or(0) == 1});
          disc.functions = functions[id(sel_functions).active_index().value_or(0)];
          disc.slave = (uint8_t) id(num_slave).state;
          disc.start = (uint16_t) id(num_start).state;
          disc.count = (uint16_t) id(num_count).state;
          disc.scan_last = (uint8_t) id(num_scan_last).state;
          disc.timeout_ms = (uint32_t) id(num_timeout).state;

interval:
  - interval: 10ms
    then:
      - lambda: disc.tick();

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
  - platform: uptime
    name: "Uptime"
